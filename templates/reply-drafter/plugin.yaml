apiVersion: dap/v1
kind: declarative
name: reply-drafter
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
description: Drafts replies for flagged threads. It never sends until you approve, and approval only saves a draft.
settings:
  - key: signature
    type: string
    label: Signature
    default: ""
triggers:
  - schedule: every 1h
inputs:
  - service: email
    window: 7d
rules:
  - id: flagged
    when:
      any:
        - label: flagged
        - subject_contains: flag
output:
  limit: 5
  report:
    title: Reply drafter
    line: subject
  actions:
    - type: draft
      rule: flagged
      body: snippet
      subject: reply
      signature_setting: signature
tile:
  size: medium
