name: reply-drafter
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
interface: dap.plugin.v1
description: Drafts replies for flagged threads. It never sends.
runtime: node
entrypoint: dist/index.js
permissions:
  - name: mail.read
    mode: allowed
    description: Read flagged threads
  - name: mail.draft
    mode: allowed
    description: Save a draft reply. Nothing is sent.
provides:
  - drafts
config:
  - key: provider
    type: string
    description: Mailbox to read (gmail, outlook, or fake)
    default: gmail
schedule:
  every: 1h
tile:
  size: medium
