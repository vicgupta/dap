name: inbox-triage
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
interface: dap.plugin.v1
description: Labels and summarizes new threads into Inbox cards. Nothing is sent.
runtime: node
entrypoint: dist/index.js
permissions:
  - name: mail.read
    mode: allowed
    description: Read new threads so they can be labeled
provides:
  - triage
config:
  - key: provider
    type: string
    description: Mailbox to read (gmail, outlook, or fake)
    default: gmail
  - key: top
    type: number
    description: How many threads to put on the card
    default: 5
schedule:
  every: 1h
tile:
  size: medium
