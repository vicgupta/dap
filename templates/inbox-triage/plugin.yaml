apiVersion: dap/v1
kind: declarative
name: inbox-triage
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
description: Labels and summarizes new threads into Inbox cards. Nothing is sent.
settings:
  - key: top
    type: number
    label: Threads to show
    description: How many threads land on the card
    default: 5
  - key: urgent_words
    type: list
    label: Urgent words
    description: Subjects containing one of these are labeled Needs a reply
    default:
      - urgent
      - asap
      - invoice
      - payment
      - deadline
triggers:
  - schedule: every 1h
  - event: email.received
inputs:
  - service: email
    window: 24h
rules:
  - id: urgent
    when:
      any:
        - subject_contains:
            setting: urgent_words
        - subject_contains: action required
output:
  limit_setting: top
  unmatched_label: Review
  report:
    title: Inbox triage
    line: subject
  actions:
    - type: label
      rule: urgent
      label: Needs a reply
tile:
  size: medium
