name: competitor-research
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
interface: dap.plugin.v1
description: Watches configured public pages and summarizes what changed.
runtime: node
entrypoint: dist/index.js
permissions:
  - name: web.fetch
    mode: ask_first
    description: Fetch the public pages listed in settings
provides:
  - pages
config:
  - key: urls
    type: list
    description: Public https pages to watch
    default: []
schedule:
  every: 1h
tile:
  size: medium
