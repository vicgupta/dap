apiVersion: dap/v1
kind: declarative
name: daily-digest
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
description: One morning card summarizing recent mail. Nothing is sent.
settings:
  - key: window
    type: string
    label: How far back
    description: 24h, 7d, or 30m
    default: 24h
triggers:
  - schedule:
      cron: "0 8 * * *"
inputs:
  - service: email
    window_setting: window
output:
  limit: 8
  report:
    title: Daily digest
    line: subject
tile:
  size: medium
