name: daily-digest
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
interface: dap.plugin.v1
description: One morning card summarizing yesterday's mail. Nothing is sent.
runtime: node
entrypoint: dist/index.js
permissions:
  - name: mail.read
    mode: allowed
    description: Read yesterday's threads for the morning card
provides:
  - digests
config:
  - key: provider
    type: string
    description: Mailbox to read (gmail, outlook, or fake)
    default: gmail
schedule:
  cron: "0 8 * * *"
tile:
  size: medium
