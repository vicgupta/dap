id: follow-up-nudger
title: Follow-up nudger
blurb: Drafts a nudge when a thread has been waiting. Nothing is sent until you approve.
mode: install
permissions:
  - mail.read
  - report.review
  - mail.draft
connections:
  - gmail
  - outlook
settings:
  - key: wait_hours
    type: number
    label: Hours before a nudge
    default: 24
  - key: signature
    type: string
    label: Signature
    default: You
