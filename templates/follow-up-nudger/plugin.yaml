apiVersion: dap/v1
kind: declarative
name: follow-up-nudger
version: 0.1.0
min_dap_version: 0.1.0
type: watcher
description: Drafts a follow-up when a thread has been waiting. Nothing is sent until you approve.
settings:
  - key: wait_hours
    type: number
    label: Hours before a nudge
    description: How long after you wrote, with no reply
    default: 24
  - key: signature
    type: string
    label: Signature
    default: You
triggers:
  - schedule: every 1h
inputs:
  - service: email
    window: 7d
rules:
  - id: waiting
    when:
      all:
        - last_from_me: true
        - no_reply_for:
            setting: wait_hours
output:
  limit: 5
  report:
    title: Follow-up nudger
    line: subject
  actions:
    - type: draft
      rule: waiting
      body: nudge
      subject: reply
      signature_setting: signature
tile:
  size: medium
