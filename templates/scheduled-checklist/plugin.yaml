apiVersion: dap/v1
kind: declarative
name: scheduled-checklist
version: 0.1.0
min_dap_version: 0.1.0
type: workflow
description: Runs an ordered checklist. Every step waits for approval. A sending step does not send by itself.
settings:
  - key: steps
    type: list
    label: Steps
    description: Ordered steps. A step may set effects to sends, spends, or deletes.
    default:
      - id: gather
        title: Gather the notes
        detail: Collect yesterday's notes into one list.
      - id: share
        title: Share the update
        detail: This sends, so it waits for approval.
        effects:
          - sends
      - id: file
        title: File the checklist
        detail: Keep a local copy of what ran.
triggers:
  - schedule: every 1h
output:
  actions:
    - type: checklist
      steps_setting: steps
tile:
  size: medium
