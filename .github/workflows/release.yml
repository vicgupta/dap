name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install lipo and rcodesign
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm zip
          curl -fsSL -o /tmp/rcodesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/rcodesign.tar.gz -C /tmp
          sudo install -m 755 /tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign

      - name: Package macOS, Linux, and Windows artifacts
        run: packaging/release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/macos/publish.sh "${GITHUB_REF_NAME}"
