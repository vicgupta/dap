name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Go tests
        run: go test ./...

      - name: Installer tests
        run: scripts/install_test.sh

      - name: Release asset tests
        run: packaging/cli_assets_test.sh

      - name: Linux package test
        run: packaging/linux/package_test.sh

      - name: Cross-compile Windows CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          bash packaging/windows/package_test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: dist/windows-cli
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-cli
          path: dist/windows-cli

      - name: Install and smoke (Windows PowerShell 5.1)
        shell: powershell
        run: .\packaging\windows\smoke.ps1

      - name: Install and smoke (PowerShell 7)
        shell: pwsh
        run: .\packaging\windows\smoke.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e
          path: |
            e2e/playwright-report
            e2e/artifacts
            e2e/test-results
          if-no-files-found: ignore
