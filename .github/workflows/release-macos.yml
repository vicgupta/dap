name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Package app and CLI
        env:
          DAP_VERSION: ${{ github.ref_name }}
          DAP_RELEASE: ${{ github.ref_name }}
        run: sh scripts/package-macos.sh "${DAP_VERSION}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          pre=""
          case "$tag" in
            *-* ) pre="--prerelease" ;;
          esac
          gh release create "$tag" $pre \
            --title "$tag" \
            --notes-file docs/release.md \
            dist/release/*
